<text x="500" y="20.5" text-anchor="middle" font-family="Fira Code,Consolas,monospace" font-size="11.5" fill="#64748b" letter-spacing="1.5">bash — Sd474</text>
<text x="46" y="44" font-family="Fira Code,Consolas,monospace" font-size="16.5" fill="#22d3ee" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.35s" begin="0.3s" fill="freeze"/>$ soumik --init</text><text x="46" y="74" font-family="Fira Code,Consolas,monospace" font-size="16.5" fill="#94a3b8" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.35s" begin="1.1s" fill="freeze"/>  loading stack ................ ok</text><text x="46" y="104" font-family="Fira Code,Consolas,monospace" font-size="16.5" fill="#94a3b8" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.35s" begin="1.8s" fill="freeze"/>  mounting pipelines ........... ok</text><text x="46" y="134" font-family="Fira Code,Consolas,monospace" font-size="16.5" fill="#94a3b8" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.35s" begin="2.5s" fill="freeze"/>  warming embeddings ........... ok</text><text x="46" y="164" font-family="Fira Code,Consolas,monospace" font-size="16.5" fill="#4ade80" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.35s" begin="3.2s" fill="freeze"/>  test set leaked .............. no</text><text x="46" y="194" font-family="Fira Code,Consolas,monospace" font-size="16.5" fill="#c4b5fd" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.35s" begin="4.0s" fill="freeze"/>  status: available for weird distributions</text>
<rect x="46" y="211" width="9.5" height="17" fill="#22d3ee" opacity="0">
