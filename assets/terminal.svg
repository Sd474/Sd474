<stop offset="0%" stop-color="#0b1020"/><stop offset="100%" stop-color="#05070e"/></linearGradient></defs>
<rect width="1000" height="250" rx="10" fill="url(#tbg)" stroke="#1e3a5f" stroke-width="1.2"/>
<rect width="1000" height="32" rx="10" fill="#111a2e"/><rect y="22" width="1000" height="10" fill="#111a2e"/>
