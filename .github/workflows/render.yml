name: render profile artwork

on:
  schedule:
    - cron: '0 3 * * *'      # daily, after the arcade job
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/render.yml']

jobs:
  render:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: render artwork from live GitHub data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
          OUT_DIR: assets/gen
        run: |
          cd scripts
          OUT_DIR=../assets/gen python3 render.py

      - name: commit if the drawing changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/gen
          git diff --staged --quiet || git commit -m "chore: redraw profile artwork [skip ci]"
          git push
